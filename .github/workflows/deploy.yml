name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      assets: ${{ steps.diff.outputs.assets }}
      deploy: ${{ steps.diff.outputs.deploy }}
      client: ${{ steps.diff.outputs.client }}
      server: ${{ steps.diff.outputs.server }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          assets=false
          client=false
          server=false
          if [ "$EVENT" = workflow_dispatch ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            assets=true
            client=true
            server=true
          else
            if git diff --quiet "$BEFORE" HEAD -- package.json bun.lock bunfig.toml packages/protocol packages/simulation .github/workflows/deploy.yml scripts/smoke-container.py; then
              :
            else
              client=true
              server=true
            fi
            if ! git diff --quiet "$BEFORE" HEAD -- packages/assets .github/workflows/deploy.yml; then
              assets=true
              client=true
            fi
            if ! git diff --quiet "$BEFORE" HEAD -- apps/game scripts/build-assets.mjs scripts/service-worker.js turbo.json; then
              client=true
            fi
            if ! git diff --quiet "$BEFORE" HEAD -- apps/server Dockerfile .dockerignore 'packages/assets/public/models/maps/*-physics.glb.gz' 'packages/assets/public/models/maps/*-nav.json' 'packages/assets/public/models/maps/*-bomb.bin.gz' 'packages/assets/public/models/maps/*-breakables.json' 'packages/assets/public/models/maps/*-doors.json'; then
              server=true
            fi
          fi
          # A code-only push can reference assets whose earlier sync failed.
          # The assets job checks the exact published receipt before downloading.
          if [ "$client" = true ]; then
            assets=true
          fi
          {
            echo "assets=$assets"
            echo "deploy=$client"
            echo "client=$client"
            echo "server=$server"
          } >> "$GITHUB_OUTPUT"
  assets:
    needs: changes
    if: needs.changes.outputs.assets == 'true'
    runs-on: [self-hosted, linux, x64, cs2go-assets]
    timeout-minutes: 120
    steps:
      - name: Check asset runner capacity
        run: |
          /opt/cs2go-assets/python/bin/python -c 'import shutil; assert shutil.disk_usage("/opt/cs2go-assets").free >= 20 * 1024**3, "Asset runner needs at least 20 GiB free"'
          echo /opt/cs2go-assets/python/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /packages/assets/
            /package.json
            /bunfig.toml
      - run: python -m pip install boto3==1.40.61
      - run: python packages/assets/sync_test.py
      - id: identity
        run: echo "tree=$(git rev-parse HEAD:packages/assets)" >> "$GITHUB_OUTPUT"
      - id: published
        run: python packages/assets/sync.py status
        env:
          ASSET_TREE: ${{ steps.identity.outputs.tree }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
      - name: Reuse persistent compression cache
        if: steps.published.outputs.complete != 'true'
        run: ln -s /var/cache/cs2go-assets/transport packages/assets/.cache
      - uses: oven-sh/setup-bun@v2
        if: steps.published.outputs.complete != 'true'
      - run: python packages/assets/sync.py seed
        if: steps.published.outputs.complete != 'true'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
      - run: bun run assets:verify
        if: steps.published.outputs.complete != 'true'
      - run: bun run assets:sync
        if: steps.published.outputs.complete != 'true'
        env:
          ASSET_TREE: ${{ steps.identity.outputs.tree }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
      - name: Prune obsolete compression cache
        if: steps.published.outputs.complete != 'true'
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          manifest = json.loads(Path("packages/assets/manifest.json").read_text())
          keep = set()
          for entry in manifest["files"].values():
              keep.add(entry["sha256"] + ".q11.br")
              if "inputSha256" in entry:
                  keep.add(entry["inputSha256"] + ".glb.gz")
          for cached in Path("/var/cache/cs2go-assets/transport").iterdir():
              if cached.is_file() and cached.name not in keep:
                  cached.unlink()
          PYTHON
  deploy:
    needs: [changes, assets]
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.deploy == 'true' && (needs.assets.result == 'success' || needs.assets.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ASSET_CDN_URL: ${{ vars.ASSET_CDN_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/
            /scripts/
            /package.json
            /bun.lock
            /bunfig.toml
            /turbo.json
            /packages/protocol/
            /packages/simulation/
            /packages/assets/package.json
            /packages/assets/manifest.json
            /packages/assets/pipeline.mjs
      - uses: oven-sh/setup-bun@v2
      - run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" && test -n "$ASSET_CDN_URL" || {
            echo 'Configure Vercel and R2 repository variables/secrets; see docs/deployment.md.'
            exit 1
          }
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: bunx --bun vercel@65.8.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: bunx --bun vercel@65.8.0 build --prod --token="$VERCEL_TOKEN"
      - run: bunx --bun vercel@65.8.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
  server-image:
    name: Publish server image
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /bun.lock
            /bunfig.toml
            /apps/game/package.json
            /apps/server/package.json
            /packages/assets/package.json
            /packages/protocol/
            /packages/simulation/
            /scripts/smoke-container.py
            /Dockerfile
            /.dockerignore
            /apps/server/
            /packages/assets/public/models/maps/*-physics.glb.gz
            /packages/assets/public/models/maps/*-nav.json
            /packages/assets/public/models/maps/*-bomb.bin.gz
            /packages/assets/public/models/maps/*-breakables.json
            /packages/assets/public/models/maps/*-doors.json
      - uses: docker/setup-buildx-action@v4
      - name: Log in to DHI
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}/server:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Smoke test server image
        run: python3 scripts/smoke-container.py server "ghcr.io/$GITHUB_REPOSITORY/server:sha-$GITHUB_SHA"
      - name: Publish server
        env:
          IMAGE: ghcr.io/${{ github.repository }}/server
        run: |
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "### Server image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:latest\` and \`$IMAGE:sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
  client-image:
    name: Publish client image
    needs: [changes, assets]
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.client == 'true' && (needs.assets.result == 'success' || needs.assets.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /bun.lock
            /bunfig.toml
            /apps/game/package.json
            /apps/server/package.json
            /packages/assets/package.json
            /packages/protocol/
            /packages/simulation/
            /scripts/smoke-container.py
            /apps/game/
            /scripts/build-assets.mjs
            /scripts/service-worker.js
            /packages/assets/manifest.json
            /packages/assets/pipeline.mjs
      - uses: docker/setup-buildx-action@v4
      - name: Log in to DHI
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build client
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/game/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}/client:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
          build-args: ASSET_CDN_URL=${{ vars.ASSET_CDN_URL }}
      - name: Smoke test client image
        run: python3 scripts/smoke-container.py client "ghcr.io/$GITHUB_REPOSITORY/client:sha-$GITHUB_SHA"
      - name: Publish client
        env:
          IMAGE: ghcr.io/${{ github.repository }}/client
        run: |
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "### Client image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:latest\` and \`$IMAGE:sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
