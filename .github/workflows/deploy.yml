name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      assets: ${{ steps.diff.outputs.assets }}
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          assets=false
          deploy=false
          if [ "$EVENT" = workflow_dispatch ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            assets=true
            deploy=true
          elif git diff --name-only "$BEFORE" HEAD -- packages/assets .github/workflows/deploy.yml | grep -q .; then
            assets=true
            deploy=true
          elif git diff --name-only "$BEFORE" HEAD -- apps packages/protocol packages/simulation package.json bun.lock bunfig.toml turbo.json scripts/build-assets.mjs scripts/service-worker.js | grep -q .; then
            deploy=true
          fi
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
  assets:
    needs: changes
    if: needs.changes.outputs.assets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /packages/assets/manifest.json
            /packages/assets/sync.py
            /packages/assets/sync_test.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install boto3==1.40.61
      - run: python packages/assets/sync_test.py
      - id: identity
        run: echo "tree=$(git rev-parse HEAD:packages/assets)" >> "$GITHUB_OUTPUT"
      - id: published
        run: python packages/assets/sync.py status
        env:
          ASSET_TREE: ${{ steps.identity.outputs.tree }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
      - if: steps.published.outputs.complete != 'true'
        run: |
          git sparse-checkout set --no-cone '/packages/assets/' '/package.json' '/bunfig.toml'
      - uses: oven-sh/setup-bun@v2
        if: steps.published.outputs.complete != 'true'
      - uses: actions/cache@v6
        if: steps.published.outputs.complete != 'true'
        with:
          path: packages/assets/.cache
          key: asset-compression-br11-${{ runner.os }}-${{ hashFiles('packages/assets/manifest.json') }}
          restore-keys: |
            asset-compression-br11-${{ runner.os }}-
            asset-compression-${{ runner.os }}-
      - run: python packages/assets/sync.py seed
        if: steps.published.outputs.complete != 'true'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
      - run: bun run assets:verify
        if: steps.published.outputs.complete != 'true'
      - run: bun run assets:sync
        if: steps.published.outputs.complete != 'true'
        env:
          ASSET_TREE: ${{ steps.identity.outputs.tree }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
  deploy:
    needs: [changes, assets]
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.deploy == 'true' && (needs.assets.result == 'success' || needs.assets.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ASSET_CDN_URL: ${{ vars.ASSET_CDN_URL }}
      MULTIPLAYER_URL: ${{ vars.MULTIPLAYER_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/
            /scripts/
            /package.json
            /bun.lock
            /bunfig.toml
            /turbo.json
            /packages/protocol/
            /packages/simulation/
            /packages/assets/package.json
            /packages/assets/manifest.json
            /packages/assets/pipeline.mjs
      - uses: oven-sh/setup-bun@v2
      - run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" && test -n "$ASSET_CDN_URL" || {
            echo 'Configure Vercel and R2 repository variables/secrets; see docs/deployment.md.'
            exit 1
          }
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: bunx --bun vercel@65.8.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: |
          if [ -n "$MULTIPLAYER_URL" ]; then
            export VITE_MULTIPLAYER_URL="$MULTIPLAYER_URL"
          fi
          bunx --bun vercel@65.8.0 build --prod --token="$VERCEL_TOKEN"
      - run: bunx --bun vercel@65.8.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
